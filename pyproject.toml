[project]
name = "autotube-ai"
version = "0.1.0"
description = "Autonomous multi-agent YouTube content pipeline (research -> script -> assets -> render -> publish) governed by critic/supervisor agents."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",          # free tier, no card required (console.groq.com)
    "langchain-google-genai>=2.0.0",  # free tier, no card required (aistudio.google.com)
    # API / server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    # Scheduling / queue
    "apscheduler>=3.10.4",
    "celery>=5.4.0",
    "redis>=5.0.0",
    # DB
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.3",  # >=3.2.0 lets pip's resolver backtrack onto psycopg 3.2.0 itself,
    # whose [binary] extra has broken metadata (pins psycopg-binary==3.2.0.dev1, unresolvable) --
    # 3.2.3 is the first release after that got fixed
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    # Validation / config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Observability
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    # External API clients
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-genai>=1.0.0",
    "pytrends>=4.9.2",
    "youtube-transcript-api>=0.6.2",
    "tavily-python>=0.5.0",
    "huggingface-hub>=0.27.0",  # AI_VIDEO beats via Inference Providers, see tools/hf_video.py
    "fal-client>=1.0.0",  # AI_VIDEO beats via direct fal.ai API, see tools/fal_video.py
    "gradio-client>=1.0.0",  # talks to the Colab-hosted video-gen endpoint, see tools/colab_video.py
    # Media
    "moviepy>=1.0.3",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "edge-tts>=7.0.0",  # free, keyless TTS (Microsoft Edge neural voices)
    # HTTP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented idiom, not a bug.
# BLE001: resilience boundaries (Celery task retry wrappers, best-effort notification dispatch)
# intentionally catch broad Exception so a single provider failure can't crash the worker.
ignore = ["B008", "BLE001"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "graph*", "api*", "scheduler*", "db*", "tools*", "worker*", "core*"]
