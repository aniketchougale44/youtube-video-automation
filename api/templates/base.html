<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoTube AI{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
    header a { text-decoration: none; color: inherit; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; }
    .badge { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.8rem; }
    .badge-awaiting_approval { background: #f5a62333; }
    .badge-published { background: #2ecc7133; }
    .badge-failed, .badge-escalated, .badge-rejected { background: #e74c3c33; }
    .badge-running, .badge-pending { background: #3498db33; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .thumbs { display: flex; gap: 1rem; flex-wrap: wrap; }
    .thumbs figure { margin: 0; text-align: center; font-size: 0.85rem; }
    .actions form { display: inline-block; margin-right: 0.5rem; }
    button { padding: 0.5rem 1.25rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .approve { background: #2ecc71; color: #fff; }
    .reject { background: #e74c3c; color: #fff; }
    textarea, input[type=text] { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    code { background: #8882; padding: 0.1rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard/"><h2>AutoTube AI — Review Dashboard</h2></a>
    <a href="/docs">API docs</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
